name: web checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: 실제 레이아웃 브라우저 검사 준비
        run: npx playwright install --with-deps chromium
      - name: 모바일 반응형·계좌·기간 브라우저 회귀
        run: npm run check:browser
      - name: 실패한 모바일 화면 캡처 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-failures
          path: browser-artifacts/
          if-no-files-found: ignore
      - name: 재생성한 차트 번들이 저장소의 배포본과 같은지 확인
        run: git diff --exit-code -- assets/sise.js
