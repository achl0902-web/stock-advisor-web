<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>P0 미리보기 · 가상 데이터</title><link rel="stylesheet" href="assets/tokens.css"><link rel="stylesheet" href="assets/app.css"><style>.demo-banner{padding:7px 14px;text-align:center;background:var(--warn-wash);color:var(--warn);font-size:12px}</style></head>
<body data-preview="true"><div class="demo-banner">개선안 미리보기 · 숫자는 설명용 가상 데이터입니다</div><header class="top"><div class="top-inner"><a class="brand" href="#/today">나의 투자</a><div class="top-tools"><span class="sync"><i></i>방금 갱신</span><span style="font-size:20px;color:var(--accent)">●</span></div></div></header><main id="view" class="wrap"></main><nav id="tabbar" class="tabbar" data-current="log"></nav>
<script src="assets/nav.js"></script>
<script type="module">
import { state } from "./assets/store.js";
import { renderToday } from "./assets/view-today.js";
import { renderAccounts } from "./assets/view-assets.js";
document.documentElement.dataset.palette = "cobalt";
const now = new Date();
const days = Array.from({length:450},(_,i)=> new Date(Date.UTC(2025,8,4+i)).toISOString().slice(0,10));
const val = (base,step,n)=> days.map((_,i)=> Math.round(base+base*Math.sin(i/31)*.035+step*i+(n?base*.01*Math.sin(i/5):0)));
const main = val(80000000,55000,1), bio=val(33000000,17000,1), pension=val(50000000,34000,1),crypto=val(21000000,8000,1);
const holdings = (code,quantity,price,currency="KRW") => [{symbol:code,qty:quantity,avg_price:price*.78,currency}];
const accounts = {
  main:{label:"주 계좌",holdings:holdings("QLD",450,125,"USD"),cash_krw:20000000},
  bio:{label:"바이오 계좌",holdings:holdings("BIO",311,150000),cash_krw:5000000},
  pension:{label:"퇴직연금 DC",kind:"pension",holdings:holdings("DC",800,60000),cash_krw:13000000,risk_asset_max_pct:70},
  crypto:{label:"비트코인",kind:"crypto",holdings:holdings("BTC",.25,125000000),cash_krw:0},
};
state.model={accounts,quotes:{QLD:{price:125,verified:true},BIO:{price:150000,verified:true},DC:{price:60000,verified:true},BTC:{price:125000000,verified:true},},names:{QLD:"QLD",BIO:"바이오",DC:"퇴직연금",BTC:"비트코인"},fx:1350,boardAt:now,boardErrors:[],
  worth:{t:days,v:{main,bio,pension,crypto},f:Object.fromEntries(["main","bio","pension","crypto"].map(k=>[k,days.map(()=>0)])),fx:days.map(()=>1350),trades:{},events:{}},
  alerts:{items:[{id:"a1",code:"QLD",name:"QLD",account:"주 계좌",alerts:[{id:"p1",price:130,op:">=",msg:"매도 검토"}]},{id:"a2",code:"BIO",name:"바이오",account:"바이오 계좌",alerts:[{id:"p2",price:145000,op:"<=",msg:"관심 매수 가격"}]}]},alertState:{fired:{},quotes:{}},
  openOrders:[{code:"QLD",name:"QLD",side:"buy",market:"US",account:"주 계좌",limit:112.5,qty:10,expires:days.at(-1)}],
  runs:[],doneIds:[],shown:0,scorecard:[],byRun:{},
};
state.strategy={regime:"in",next:"in",date:days.at(-1),votes:2,axes:[true,false,true,false],macro:.11};
state.repo={raw:async()=>({items:[{date:days.at(-1),title:"미국 주요 경제지표 발표",kind:"cpi"}]})};
function draw(){ if(location.hash.includes("assets"))renderAccounts(); else renderToday();
 document.querySelectorAll("#tabbar a").forEach(a=>a.setAttribute("aria-current",a.dataset.tab===(location.hash.includes("assets")?"assets":"today")?"page":"false"));
 setTimeout(()=>document.body.dataset.overflow=(document.documentElement.scrollWidth-innerWidth),200);
}
window.addEventListener("hashchange",draw);draw();
</script></body></html>
